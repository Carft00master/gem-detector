# ==============================================================================
# SCANNER PRESETS FOR DIFFERENT TRADING STYLES
# Usage: python run_scanner.py --preset [preset_name]
# ==============================================================================

presets:
  # 1. Microcap Sniper: Earliest possible detection ($8k - $25k MC)
  microcap_sniper:
    description: "Catching tokens at initial liquidity/bonding inflection ($8k-$25k MC)"
    filters:
      min_market_cap_usd: 8000
      max_market_cap_usd: 25000
      min_liquidity_usd: 2000
      min_liquidity_mc_ratio: 0.15
      min_buy_sell_ratio: 1.4
      min_unique_buyers: 25
      max_top10_holder_percent: 25.0
      max_dev_holding_percent: 3.5
    scoring:
      alert_score_threshold: 70

  # 2. Momentum Breakout: Confirmed volume & buyer surge ($20k - $55k MC)
  momentum_breakout:
    description: "Focus on strong volume acceleration and high buy pressure ($20k-$55k MC)"
    filters:
      min_market_cap_usd: 20000
      max_market_cap_usd: 55000
      min_liquidity_usd: 4000
      min_liquidity_mc_ratio: 0.18
      min_volume_5m_usd: 2500
      min_volume_mc_ratio: 0.9
      min_buy_sell_ratio: 1.6
      min_unique_buyers: 45
      max_top10_holder_percent: 22.0
    scoring:
      alert_score_threshold: 75

  # 3. High Conviction 300x Alpha: Strict decentralized criteria, low top 10, clean dev
  high_conviction:
    description: "Ultra-strict filters mimicking top historical 300x breakout tokens"
    filters:
      min_market_cap_usd: 12000
      max_market_cap_usd: 45000
      min_liquidity_usd: 3500
      min_liquidity_mc_ratio: 0.22
      min_volume_5m_usd: 2000
      min_volume_mc_ratio: 0.8
      max_volume_mc_ratio: 4.5
      min_buy_sell_ratio: 1.7
      min_unique_buyers: 50
      min_buyer_seller_ratio: 1.5
      max_top10_holder_percent: 18.0
      max_dev_holding_percent: 2.0
    scoring:
      alert_score_threshold: 80

  # 4. Base DEX Breakout: Tuned for Base network Uniswap / Aerodrome tokens
  base_breakout:
    description: "Tuned specifically for Base network microcaps"
    scanner:
      active_chains:
        - base
    filters:
      min_market_cap_usd: 10000
      max_market_cap_usd: 50000
      min_liquidity_usd: 3000
      min_liquidity_mc_ratio: 0.20
      min_buy_sell_ratio: 1.5
      max_top10_holder_percent: 22.0
    scoring:
      alert_score_threshold: 75
