# ==============================================================================
# GEM DETECTOR - REAL-TIME CONFIGURATION & THRESHOLDS
# Identifies sub-$10K tokens with high probability of reaching $3M+ Market Cap
# ==============================================================================

scanner:
  # Chains to scan: 'solana', 'bsc' (default: solana, bsc)
  active_chains:
    - solana
    - bsc
  
  # Scan poll interval in seconds
  poll_interval_sec: 10
  
  # Maximum age of tokens in minutes to consider as "Early Stage"
  max_token_age_minutes: 180
  
  # Enable real-time websocket feed where available
  enable_websocket_feed: true
  
  # Number of top candidates to display on live terminal dashboard
  dashboard_display_limit: 15

# ==============================================================================
# PROVIDER TIER ARCHITECTURE & BUDGETS (Zero-Budget FREE Tier vs PAID)
# ==============================================================================
provider:
  tier: "FREE"                         # "FREE" (PumpPortal detection + polled reserves) | "PAID" (Yellowstone gRPC)
  endpoint_budgets:                    # Explicit per-endpoint monthly credit budgets (strictly enforced, fails if missing)
    # 1. Helius Free Plan: 1,000,000 credits/month, 10 req/s RPC, 2 req/s DAS (Verified Oct 2026)
    #    Unit: credits (1 credit/std RPC: getTransaction, getSignaturesForAddress, getAccountInfo; 10 credits: DAS/getProgramAccounts)
    #    Source: https://www.helius.dev/pricing | https://docs.helius.dev/welcome-to-helius/limits-and-plans
    helius: 1000000

    # 2. QuickNode 30-Day Trial: 10,000,000 API credits (24 days remaining, EXPIRING) (~25 req/s limit)
    #    Unit: API credits (1 credit/call for standard Solana JSON-RPC)
    #    Source: https://www.quicknode.com/pricing (30-day trial account, not recurring monthly free tier)
    quicknode: 10000000

    # 3. Alchemy Free Tier: Quota UNVERIFIED (0 requests in 24h observed on dashboard, pending confirmation from user plan page)
    #    Unit: Compute Units (CUs) (10-25 CUs per standard Solana JSON-RPC method)
    #    Source: https://www.alchemy.com/pricing (marked UNVERIFIED until verified from user dashboard plan page)
    alchemy: 30000000

    # 4. Ankr Freemium Tier (Free): 200,000,000 API credits/month (~30 req/s limit) (Verified Oct 2026)
    #    Unit: API credits (Standard EVM/Solana JSON-RPC weight; historical tx methods disabled on free plan)
    #    Source: https://www.ankr.com/rpc/pricing/ | https://www.ankr.com/docs/rpc-service/service-plans/
    ankr: 200000000

    # 5. dRPC Free Tier ($0 Plan): 210,000,000 Compute Units (CUs)/month (~2,100 CUPS / ~100 RPS) (Verified Oct 2026)
    #    Unit: Compute Units (CUs) (20 CU: getTransaction, getMultipleAccounts; 10 CU: getAccountInfo, getLatestBlockhash)
    #    Source: https://drpc.org/pricing | https://drpc.org/docs/pricing
    drpc: 210000000

  credit_warn_threshold_pct: 0.70      # Log warning alert at 70% of monthly budget
  credit_hard_stop_threshold_pct: 0.95 # Hard stop at 95% of monthly budget
  pool_poll_interval_sec: 3.0          # Batched polling interval for open positions + watchlist (2-5s)
  enable_live_route_b_in_free_tier: false # Live Route B disabled in FREE tier
  fallback_providers:                  # Ordered fallback providers (Alchemy first, reconnect to primary with backoff)
    - alchemy
    - helius
  exclude_providers:                   # Excluded providers (QuickNode trial limit reached: -32003 / HTTP 429)
    - quicknode

# ==============================================================================
# PAPER TRADING & EXECUTION ENGINE
# ==============================================================================
paper_trading:
  default_exit_policy: "STAGED_EXITS"   # "STAGED_EXITS" (Targets $1M-$3M+ runners) | "TRAILING_STOP" | "FIXED_TARGETS"


# ==============================================================================
# BREAKOUT CHARACTERISTICS & HARD FILTERS
# ==============================================================================
filters:
  # Target Market Cap window for earliest reliable detection ($5k-$75k Sub-10k Gem Inflection Zone)
  min_market_cap_usd: 5000         # Allows sub-$10k early inflection breakouts
  max_market_cap_usd: 75000        # Validated early breakout runway
  min_token_age_minutes: 0.5       # Fast entry with 30s confirmation window
  min_p_reach_3m: 0.09             # Minimum 9.0% P(3M) breakout probability gate

  # Liquidity Health (Deep Pool & Slippage Protection)
  min_liquidity_usd: 6000          # Min $6,000 USD pool depth (eliminates 86.8% illiquid loss rate)
  min_liquidity_mc_ratio: 0.15     # Liquidity must be at least 15% of Market Cap

  # Volume & Velocity
  min_volume_5m_usd: 2000          # Min $2,000 5m volume
  min_volume_mc_ratio: 0.6         # 5m/1h volume to MC ratio >= 0.6x
  max_volume_mc_ratio: 5.0         # Volume > 5x MC flags suspicious wash trading

  # Order Flow & Pressure
  min_buy_sell_ratio: 1.5          # Buys must exceed sells by at least 1.5x (60%+ buys)
  min_unique_buyers: 40            # At least 40 unique buying wallets (organic distribution)
  min_buyer_seller_ratio: 1.4      # Unique buyers vs sellers ratio

  # Holder Decentralization & Security (Zero-Tolerance Dev Dump Protection)
  max_top10_holder_percent: 18.0   # Top 10 wallets hold < 18% of supply (down from 20%)
  max_dev_holding_percent: 3.0     # Deployer wallet holds < 3.0% (realistic organic launch)
  require_mint_renounced: true     # Mint authority must be disabled
  require_freeze_renounced: true   # Freeze authority must be disabled
  max_allowed_tax_percent: 1.0     # Max buy/sell tax (0% standard on Solana)


# ==============================================================================
# COMPOSITE GEM SCORE WEIGHTS (Total = 100)
# ==============================================================================
scoring:
  # Minimum score (0-100) to trigger alerts and display as high-probability breakout
  alert_score_threshold: 75

  weights:
    # 1. Holder Distribution & Decentralization (Max 25 pts)
    # Rewards low top-10 concentration, high holder velocity, dev exit
    holder_distribution: 25

    # 2. Volume & Momentum Dynamics (Max 25 pts)
    # Rewards healthy Vol/MC ratio, accelerating 5m/1h volume, consistent txs
    volume_momentum: 25

    # 3. Order Flow & Buyer Pressure (Max 20 pts)
    # Rewards high buy/sell ratio, unique buyer count, organic ticket sizes
    order_flow: 20

    # 4. Liquidity Depth & Lock Quality (Max 20 pts)
    # Rewards high LP/MC ratio, 100% burned/locked liquidity
    liquidity_health: 20

    # 5. Social Presence & Virality Acceleration (Max 10 pts)
    # Rewards verified X/Twitter, active Telegram, website, DexScreener profile
    social_virality: 10

# ==============================================================================
# NOTIFICATION & ALERT HOOKS
# ==============================================================================
alerts:
  telegram:
    enabled: false
    bot_token: ""               # e.g., "123456789:ABCdefGhIJKlmNoPQRstuVWXyz"
    chat_id: ""                 # e.g., "-1001234567890" or "@mychannel"
    min_score_for_alert: 75

  discord:
    enabled: false
    webhook_url: ""             # e.g., "https://discord.com/api/webhooks/..."
    min_score_for_alert: 75

  terminal:
    sound_alert: true           # Beep on high score (Score >= 80)
    log_to_file: true
    log_file_path: "logs/detected_gems.jsonl"


# ==============================================================================
# PHASE 2 ROUTE ARCHITECTURE & EXECUTION POLICIES
# ==============================================================================
routes:
  route_a:
    name: "Organic Breakout"
    max_concurrent_positions: 5
    position_size_usd: 100.0
    exit_policy: "STAGED_EXITS"
    priority_fee_sol: 0.005
    allow_same_mint_cross_route: true

  route_b:
    name: "First-Block Migration Sniper"
    max_concurrent_positions: 2
    position_size_usd: 50.0
    priority_fee_sol_env: "ROUTE_B_PRIORITY_FEE_SOL"
    default_priority_fee_sol: 0.015
    tip_sol_env: "ROUTE_B_TIP_SOL"
    default_tip_sol: 0.050
    tip_distribution_scenarios: ["low", "median", "high"] # derived from observed Jito tip-account transfers
    allow_same_mint_cross_route: true
    landing_probability:
      model: "empirical_histogram" # No exponential decay
      p_land_slot_s: 0.0            # Reactive bot cannot land in slot S of observed event
      derive_from_latency_and_tips: true
      label_single_slot_tokens_as: "UNREACHABLE"
    
  concurrency_and_exposure:
    global_exposure_cap_binding: false # Non-binding in paper mode (log breaches only)
    route_a_max_concurrent: 5
    route_b_max_concurrent: 2
    same_mint_across_routes: true       # Route A allowed to enter same mint (e.g. after Route B exits)

